name: WSPIN
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip>=23.0
  - numpy>=1.26

  - pip:
    # ── PyTorch (CUDA 12.1) ───────────────────────────────────
    - torch==2.10.0
    - torchvision==0.25.0
    - torchaudio==2.10.0

    # ── HuggingFace stack ────────────────────────────────────
    - transformers==4.57.6
    - datasets==2.14.7
    - tokenizers==0.22.2
    - huggingface_hub==0.36.2
    - safetensors==0.7.0
    - accelerate==1.13.0
    - peft==0.19.0
    - evaluate==0.4.6

    # ── Training utilities ───────────────────────────────────
    - hydra-core==1.3.2
    - omegaconf==2.3.0
    - wandb==0.26.0
    - tqdm==4.67.3

    # ── Inference ────────────────────────────────────────────
    - vllm==0.19.0
    - sentencepiece==0.2.1
    - protobuf==6.33.6
    - einops==0.8.2
    - tiktoken==0.12.0
    - tensor-parallel==2.0.0

    # ── Data processing ──────────────────────────────────────
    - beautifulsoup4==4.14.3

    # ── Evaluation ───────────────────────────────────────────
    - rouge_score==0.1.2
    - nltk==3.9.4
    - scipy==1.15.3
    - numexpr==2.14.1

    # ── lm-evaluation-harness (local editable install) ───────
    # After activating env, run: pip install -e lm-evaluation-harness/

    # ── General ──────────────────────────────────────────────
    - pandas==2.3.3
    - psutil==7.2.2
    - requests==2.33.1
    - packaging==26.0
    - aiohttp==3.13.5
